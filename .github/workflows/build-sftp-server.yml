name: Build patched sftp-server

on:
  workflow_dispatch:

# Strategy (verified working on Ubuntu 24.04):
#
# 1. Enable deb-src and pull zlib + openssl + openssh source via `apt source`
#    — no external downloads needed, no network blocks
# 2. Cross-compile zlib with `make CC=<cross-gcc>` (NOT via ./configure env prefix)
# 3. Cross-compile openssl with `CC=<cross-gcc> ./Configure`
# 4. Run autoreconf on openssh apt source (required — configure.ac is newer than configure)
# 5. Configure + make sftp-server with sysroot CFLAGS/LDFLAGS
#
# Produces:
#   sftp-server-arm64-static  — for Termux proot-distro (Android aarch64)
#   sftp-server-i386-static   — for iSH (iOS x86/i686)

jobs:
  # ── arm64 static (Termux proot-distro Debian) ─────────────────────────────
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable deb-src and install cross toolchain
        run: |
          echo "deb-src http://archive.ubuntu.com/ubuntu noble main" \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu autoconf make

      - name: Fetch sources via apt
        run: |
          mkdir -p ~/src && cd ~/src
          apt-get source zlib1g 2>&1 | tail -2
          apt-get source openssl  2>&1 | tail -2
          apt-get source openssh-server 2>&1 | tail -2

      - name: Cross-compile zlib (aarch64)
        run: |
          SYSROOT=~/sysroot-aarch64
          mkdir -p $SYSROOT
          ZLIBDIR=$(ls -d ~/src/zlib-* | head -1)
          cd $ZLIBDIR
          ./configure --prefix=$SYSROOT --static
          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            CFLAGS="-static"
          make install

      - name: Cross-compile openssl (aarch64)
        run: |
          SYSROOT=~/sysroot-aarch64
          SSLDIR=$(ls -d ~/src/openssl-* | head -1)
          cd $SSLDIR
          CC=aarch64-linux-gnu-gcc \
            ./Configure linux-aarch64 no-shared no-tests \
              --prefix=$SYSROOT \
              --openssldir=$SYSROOT/etc/ssl
          make -j$(nproc) build_libs
          make install_dev

      - name: Patch + build sftp-server (aarch64)
        run: |
          SYSROOT=~/sysroot-aarch64
          SSHDIR=$(ls -d ~/src/openssh-* | head -1)
          cd $SSHDIR

          sed -i 's/platform_disable_tracing(1)/platform_disable_tracing(0)/' sftp-server.c
          grep -n 'platform_disable_tracing' sftp-server.c

          autoreconf 2>/dev/null || true

          ./configure \
            --host=aarch64-linux-gnu \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-static -I${SYSROOT}/include" \
            LDFLAGS="-static -L${SYSROOT}/lib" \
            --with-ssl-dir=${SYSROOT} \
            --without-pam \
            --without-selinux \
            --without-audit \
            --without-shadow \
            --prefix=/usr \
            --sysconfdir=/etc/ssh

          make sftp-server

      - name: Verify binary
        run: |
          SSHDIR=$(ls -d ~/src/openssh-* | head -1)
          file $SSHDIR/sftp-server
          ls -lh $SSHDIR/sftp-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sftp-server-arm64-static
          path: ~/src/openssh-*/sftp-server

  # ── i386 static (iSH Alpine x86) ──────────────────────────────────────────
  build-i386:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable deb-src and install cross toolchain
        run: |
          echo "deb-src http://archive.ubuntu.com/ubuntu noble main" \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y gcc-i686-linux-gnu autoconf make

      - name: Fetch sources via apt
        run: |
          mkdir -p ~/src && cd ~/src
          apt-get source zlib1g 2>&1 | tail -2
          apt-get source openssl  2>&1 | tail -2
          apt-get source openssh-server 2>&1 | tail -2

      - name: Cross-compile zlib (i686)
        run: |
          SYSROOT=~/sysroot-i686
          mkdir -p $SYSROOT
          ZLIBDIR=$(ls -d ~/src/zlib-* | head -1)
          cd $ZLIBDIR
          ./configure --prefix=$SYSROOT --static
          make -j$(nproc) \
            CC=i686-linux-gnu-gcc \
            AR=i686-linux-gnu-ar \
            RANLIB=i686-linux-gnu-ranlib \
            CFLAGS="-static -m32"
          make install

      - name: Cross-compile openssl (i686)
        run: |
          SYSROOT=~/sysroot-i686
          SSLDIR=$(ls -d ~/src/openssl-* | head -1)
          cd $SSLDIR
          CC=i686-linux-gnu-gcc \
            ./Configure linux-x86 no-shared no-tests \
              --prefix=$SYSROOT \
              --openssldir=$SYSROOT/etc/ssl
          make -j$(nproc) build_libs
          make install_dev

      - name: Patch + build sftp-server (i686)
        run: |
          SYSROOT=~/sysroot-i686
          SSHDIR=$(ls -d ~/src/openssh-* | head -1)
          cd $SSHDIR

          sed -i 's/platform_disable_tracing(1)/platform_disable_tracing(0)/' sftp-server.c
          grep -n 'platform_disable_tracing' sftp-server.c

          autoreconf 2>/dev/null || true

          ./configure \
            --host=i686-linux-gnu \
            CC=i686-linux-gnu-gcc \
            CFLAGS="-static -m32 -I${SYSROOT}/include" \
            LDFLAGS="-static -m32 -L${SYSROOT}/lib" \
            --with-ssl-dir=${SYSROOT} \
            --without-pam \
            --without-selinux \
            --without-audit \
            --without-shadow \
            --prefix=/usr \
            --sysconfdir=/etc/ssh

          make sftp-server

      - name: Verify binary
        run: |
          SSHDIR=$(ls -d ~/src/openssh-* | head -1)
          file $SSHDIR/sftp-server
          ls -lh $SSHDIR/sftp-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sftp-server-i386-static
          path: ~/src/openssh-*/sftp-server

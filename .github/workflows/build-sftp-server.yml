name: Build patched sftp-server

on:
  workflow_dispatch:

# Strategy (verified working on Ubuntu 24.04):
#
# Use apt multiarch to get pre-built static libs — no cross-compiling deps.
#   i386  → libssl-dev:i386  + zlib1g-dev:i386  from archive.ubuntu.com
#   arm64 → libssl-dev:arm64 + zlib1g-dev:arm64 from ports.ubuntu.com
#
# Libs land at:
#   /usr/lib/i386-linux-gnu/    (i386)
#   /usr/lib/aarch64-linux-gnu/ (arm64)
#
# openssh apt source is used directly — no version pinning needed.
# autoreconf is required because configure.ac is newer than configure in apt source.
#
# Total expected time per job: ~2-3 min (vs ~8 min building openssl from source)

jobs:
  # ── arm64 static — Termux proot-distro (Android) ──────────────────────────
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup arm64 multiarch + cross toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu autoconf make \
            libssl-dev:arm64 zlib1g-dev:arm64

      - name: Fetch openssh source
        run: |
          echo "deb-src http://archive.ubuntu.com/ubuntu noble main" \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          mkdir -p ~/src && cd ~/src
          apt-get source openssh-server 2>&1 | tail -2
          echo "SSHDIR=$(ls -d ~/src/openssh-* | head -1)" >> $GITHUB_ENV

      - name: Patch + autoreconf
        working-directory: ${{ env.SSHDIR }}
        run: |
          sed -i 's/platform_disable_tracing(1)/platform_disable_tracing(0)/' sftp-server.c
          grep -n 'platform_disable_tracing' sftp-server.c
          autoreconf 2>/dev/null || true

      - name: Configure (aarch64 static)
        working-directory: ${{ env.SSHDIR }}
        run: |
          ./configure \
            --host=aarch64-linux-gnu \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-static -I/usr/include/aarch64-linux-gnu" \
            LDFLAGS="-static -L/usr/lib/aarch64-linux-gnu" \
            --with-ssl-dir=/usr/lib/aarch64-linux-gnu \
            --without-pam \
            --without-selinux \
            --without-audit \
            --without-shadow \
            --prefix=/usr \
            --sysconfdir=/etc/ssh

      - name: Build sftp-server
        working-directory: ${{ env.SSHDIR }}
        run: make sftp-server

      - name: Verify
        working-directory: ${{ env.SSHDIR }}
        run: |
          file sftp-server
          ls -lh sftp-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sftp-server-arm64-static
          path: ${{ env.SSHDIR }}/sftp-server

  # ── i386 static — iSH (iOS) ────────────────────────────────────────────────
  build-i386:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup i386 multiarch + cross toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-i686-linux-gnu autoconf make \
            libssl-dev:i386 zlib1g-dev:i386

      - name: Fetch openssh source
        run: |
          echo "deb-src http://archive.ubuntu.com/ubuntu noble main" \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          mkdir -p ~/src && cd ~/src
          apt-get source openssh-server 2>&1 | tail -2
          echo "SSHDIR=$(ls -d ~/src/openssh-* | head -1)" >> $GITHUB_ENV

      - name: Patch + autoreconf
        working-directory: ${{ env.SSHDIR }}
        run: |
          sed -i 's/platform_disable_tracing(1)/platform_disable_tracing(0)/' sftp-server.c
          grep -n 'platform_disable_tracing' sftp-server.c
          autoreconf 2>/dev/null || true

      - name: Configure (i686 static)
        working-directory: ${{ env.SSHDIR }}
        run: |
          ./configure \
            --host=i686-linux-gnu \
            CC=i686-linux-gnu-gcc \
            CFLAGS="-static -m32 -I/usr/include/i386-linux-gnu" \
            LDFLAGS="-static -m32 -L/usr/lib/i386-linux-gnu" \
            --with-ssl-dir=/usr/lib/i386-linux-gnu \
            --without-pam \
            --without-selinux \
            --without-audit \
            --without-shadow \
            --prefix=/usr \
            --sysconfdir=/etc/ssh

      - name: Build sftp-server
        working-directory: ${{ env.SSHDIR }}
        run: make sftp-server

      - name: Verify
        working-directory: ${{ env.SSHDIR }}
        run: |
          file sftp-server
          ls -lh sftp-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sftp-server-i386-static
          path: ${{ env.SSHDIR }}/sftp-server
